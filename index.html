<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC-AMP - Tool Relocated</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
         :root {
            --primary-color: #004d40; /* Dark Teal */
            --background-color: #f0f4c3; /* Light Lime */
            --text-color: #333; /* Dark Gray */
            --container-bg-color: #ffffff; /* White */
            --warning-bg: #ffe0b2; /* Light orange for warning */
            --warning-text: #e65100; /* Darker orange text */
            --warning-border: #ff9800; /* Orange border */
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; 
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 2rem;
            background: var(--container-bg-color);
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px; 
        }

        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            width: 100%;
        }
        .logos-container img {
            transform: scale(1.083); 
            max-width: 100%;  
            height: auto;     
        }

        #relocation-message {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 1.1em;
            line-height: 1.5;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #relocation-message p {
            margin-top: 0;
            margin-bottom: 10px;
        }

        #relocation-message p:last-child {
            margin-bottom: 0;
        }

        #relocation-message a {
            color: var(--primary-color);
            text-decoration: underline;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px; 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logos-container">
        <img src="image2.png" alt="Tool Logo">
    </div>

    <div id="relocation-message">
        <p style="font-weight: bold;"><i class="fas fa-exclamation-triangle"></i> Important Notice: This tool has moved!</p>
        <p>
            Due to technical limitations, this version of EPIC-AMP is no longer functional for predictions.
            <br>Please visit the fully working version at our new home:
            <a href="https://nonzeroexit-epic-amp.static.hf.space/index.html">https://nonzeroexit-epic-amp.static.hf.space/index.html</a>
        </p>
    </div>
</div>

</body>
</html>
